name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装环境
        run: sudo apt-get update -y && sudo apt-get install -y python3 python3-pip python3-setuptools python3-dev python3-venv git zip unzip openjdk-11-jdk-headless build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libffi-dev libssl-dev ccache wget && pip3 install --upgrade pip && pip3 install buildozer cython==0.29.36 && buildozer --version

      - name: 安装 Android SDK 命令行工具
        run: wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip && mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest && unzip -q cmdtools.zip -d /tmp/cmdtools && mv /tmp/cmdtools/cmdline-tools/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ && rm -rf /tmp/cmdtools cmdtools.zip && echo INSTALLED && ls $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/

      - name: 接受 SDK License
        run: mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses && printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license && printf '84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license && echo LICENSES_DONE

      - name: 构建 APK
        run: buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mutiny-android-apk
          path: bin/*.apk
          if-no-files-found: error
