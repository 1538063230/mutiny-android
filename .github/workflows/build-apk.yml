name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 与 OpenJDK 11
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-setuptools python3-dev python3-venv \
            git zip unzip openjdk-11-jdk-headless \
            build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 libffi-dev libssl-dev \
            ccache
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36
          java -version
          javac -version
          buildozer --version

      - name: 构建 APK
        env:
          P4A_ACCEPT_ALL: 'True'
        run: |
          buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mutiny-android-apk
          path: bin/*.apk
          if-no-files-found: error
