name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装 Buildozer 与系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-setuptools \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 libffi-dev libssl-dev \
            ccache
          pip install --upgrade pip
          pip install buildozer cython
          buildozer --version

      - name: 接受 Android SDK licenses
        run: |
          export P4A_ACCEPT_ALL=True
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          cat > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license << 'EOF'
8933bad161af4178b1185d1a37fbf41ea5269c55
d56f5187479451eabf01fb78af6dfcb131a6481e
24333f8a63b6825ea9c5514f83c2829b004d1fee
EOF
          cat > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license << 'EOF'
84831b9409646a918e30573bab4c9c91346d8abd
504667f4c0de7af1a06de9f4b1727b84351f2910
EOF
          mkdir -p $ANDROID_HOME/licenses 2>/dev/null || true
          cp $HOME/.buildozer/android/platform/android-sdk/licenses/* $ANDROID_HOME/licenses/ 2>/dev/null || true
          echo "licenses prepared"

      - name: 构建 APK
        env:
          P4A_ACCEPT_ALL: 'True'
          ANDROID_HOME: $HOME/.buildozer/android/platform/android-sdk
        run: |
          buildozer android debug 2>&1 | tee build.log
          ls -la bin/ || echo 'no bin dir'

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutiny-android-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
